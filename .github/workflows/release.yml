name: Release

# Push a tag like v0.1.0 and this builds the app and publishes it as a download on the Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # macos-15 runners are Apple silicon, which is what Nimbus is built for.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package the app
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Nimbus-AppleSilicon.zip \
            --title "Nimbus $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
