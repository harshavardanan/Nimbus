name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # Swift Testing needs Xcode 16 or later.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
